# Rebuttal ablation: chan_w_iv2xyz — launch like base.yaml (hydra root); 50k steps.
defaults:
  - data: audioset_ambisonics
  - optimizer: adamW
  - trainer: default_trainer
  - patching: frame_paper        # 200-token grid; budget rule in masking/*.yaml
  - masking: random
  - _self_

model: AudioSphereChannelMasked
model_size: base
save_dir: /projects/0/prjs1338/ablations/chan_w_iv2xyz
use_mwmae_decoder: True
ckpt_path: null
seed: 42
channel_mask_mode: w_iv2xyz
# Channel-axis run (infill regime): encoder sees ALL tokens (~2x encoder cost).
# add_mask_indicator doubles conv in_channels to 14 — identical across all four
# modes, so the quartet is architecture-matched and only the mask policy varies.
# mask_patch (from data cfg) = per-channel location budget; used ONLY by
# tube/independent. mel2iv & w_iv2xyz mask full channel groups (3/7 of elements)
# — different OBJECTIVES, not ratio-matched strategies; caption accordingly.
add_mask_indicator: True
